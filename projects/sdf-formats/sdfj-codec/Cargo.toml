[package]
name = "sdfj-codec"
version = "0.3.0"
edition = "2024"
license-file = "LICENSE"
repository = "https://github.com/tyleo/tyt"
description = "Encodes sdfj types into .sdfj / .sdfjz documents."
keywords = ["sdf", "sdfj", "json", "3d", "codec"]
categories = ["encoding", "game-development", "graphics", "parser-implementations"]

[package.metadata.workspaces]
independent = true

[dependencies]
flate2 = { version = "1", optional = true }
fontdb = { version = "0.24.0", optional = true }
serde_json = { version = "1", features = [
    "float_roundtrip",
    "preserve_order",
], optional = true }
sdfj = { version = "0.3.0", default-features = false }
ttf-parser = { version = "0.25.1", optional = true }
ty-zip = "0.1.0"

[features]
default = ["impl"]
impl = ["dep:flate2", "dep:fontdb", "dep:serde_json", "dep:ttf-parser", "sdfj/serde"]
