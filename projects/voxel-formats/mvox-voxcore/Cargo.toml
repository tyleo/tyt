[package]
name = "mvox-voxcore"
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"
repository = "https://github.com/tyleo/tyt"
description = "Converts between MagicaVoxel files and the voxcore state."
keywords = ["magicavoxel", "vox", "voxel", "3d", "conversion"]
categories = ["encoding", "game-development", "graphics"]

[dependencies]
branded-id = "0.1.10"
mvox = "0.1.1"
mvox-codec = { version = "0.1.2", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
ty-math = "0.2.0"
voxcore = { version = "0.2.1", default-features = false, features = ["color"] }

[dev-dependencies]
serde_json = "1"

[features]
default = ["codec", "serde"]
codec = ["dep:mvox-codec"]
serde = ["dep:serde", "branded-id/serde"]
