[package]
name = "voxj-voxcore"
version = "0.2.0"
edition = "2024"
license-file = "LICENSE"
repository = "https://github.com/tyleo/tyt"
description = "Converts between Voxel Json documents and the voxcore state."
keywords = ["voxel", "voxj", "json", "3d", "conversion"]
categories = ["encoding", "game-development", "graphics"]

[dependencies]
branded-id = "0.1.7"
ty-math = "0.2.0"
voxcore = "0.2.1"
voxj = { version = "0.1.3", default-features = false }
voxj-codec = { version = "0.2.0", optional = true }

[dev-dependencies]
# The tests transcode and cost blocks through voxj's implementation.
voxj = { version = "0.1.3", features = ["impl"] }

[features]
default = ["codec"]
codec = ["dep:voxj-codec"]
