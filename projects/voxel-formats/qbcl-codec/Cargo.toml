[package]
name = "qbcl-codec"
version = "0.1.1"
edition = "2024"
license-file = "LICENSE"
repository = "https://github.com/tyleo/tyt"
description = "Reads and writes Qubicle (.qb / .qbt / .qbcl) files."
keywords = ["qubicle", "qb", "qbt", "voxel", "codec"]
categories = ["parser-implementations", "encoding", "game-development", "graphics"]

[dependencies]
flate2 = { version = "1", optional = true }
qbcl = { version = "0.1.1", default-features = false }

[features]
default = ["impl", "qb", "qbt", "qbcl"]
impl = ["dep:flate2"]
qb = ["qbcl/qb"]
qbt = ["qbcl/qbt"]
qbcl = ["qbcl/qbcl"]
