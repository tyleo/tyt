[package]
name = "gltf-meshdoc"
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"
repository = "https://github.com/tyleo/tyt"
description = "Converts between glTF files and the meshdoc state."
keywords = ["gltf", "glb", "mesh", "3d", "conversion"]
categories = ["encoding", "game-development", "graphics"]

[dependencies]
base64 = { version = "0.22", optional = true }
branded-id = "0.1.10"
gltf = { version = "1.4.1", default-features = false, features = [
    "extensions",
    "extras",
    "names",
    "utils",
    "KHR_materials_emissive_strength",
    "KHR_materials_ior",
    "KHR_materials_transmission",
] }
meshdoc = "0.1.0"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = "1"
ty-math = { version = "0.2.0", default-features = false, features = ["color"] }

[dev-dependencies]
base64 = "0.22"

[features]
default = ["codec", "serde"]
codec = []
serde = ["dep:serde", "branded-id/serde"]
impl = ["dep:base64"]
