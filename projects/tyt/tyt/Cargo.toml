[package]
name = "tyt"
version = "0.1.8"
edition = "2024"
license-file = "LICENSE"
repository = "https://github.com/tyleo/tyt"
description = "A single app, `tyt`, which ties all my command-line tools together."
autobins = false

[[bin]]
name = "tyt"
path = "src/main.rs"
required-features = ["bin"]

[dependencies]
clap = { version = "4.5.58", features = ["derive"] }
clap_complete = { version = "4.5", optional = true }
tyt-claude = { version = "0.1.0" }
tyt-common = { version = "0.1.0" }
tyt-cubemap = { version = "0.1.0" }
tyt-fbx = { version = "0.1.0" }
tyt-fs = { version = "0.1.0" }
tyt-image = { version = "0.1.0" }
tyt-material = { version = "0.1.0" }
tyt-meshy = { version = "0.1.0" }
tyt-meta = { version = "0.1.0" }
tyt-oai = { version = "0.1.0" }
tyt-vmax = { version = "0.1.0" }
vxl = { version = "0.1.0" }

[features]
default = ["impl"]
impl = ["tyt-claude/impl", "tyt-cubemap/impl", "tyt-fbx/impl", "tyt-fs/impl", "tyt-image/impl", "tyt-material/impl", "tyt-meshy/impl", "tyt-meta/impl", "tyt-oai/impl", "tyt-vmax/impl", "vxl/impl"]
bin = ["impl", "dep:clap_complete"]
