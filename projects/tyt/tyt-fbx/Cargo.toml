[package]
name = "tyt-fbx"
version = "0.5.0"
edition = "2024"
license-file = "LICENSE"
repository = "https://github.com/tyleo/tyt"
description = "Command-line tools for working with FBX files."
autobins = false

[package.metadata.workspaces]
independent = true

[[bin]]
name = "fbx"
path = "src/main.rs"
required-features = ["bin"]

[dependencies]
branded-id = "0.2.0"
clap = { version = "4.5.58", features = ["derive"] }
treegrid = { version = "0.5.0", default-features = false, features = [
    "render_box_hierarchy",
] }
treeselect = "0.3.0"
ty-clap = { version = "0.2.0", optional = true }
tyt-common = { version = "0.4.0" }
ty-math = { version = "0.5.0" }
tyt-injection = { version = "0.5.0", optional = true }

[features]
default = ["impl"]
impl = ["dep:tyt-injection"]
bin = ["impl", "dep:ty-clap"]
