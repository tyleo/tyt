[package]
name = "tyt-meshy"
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"
repository = "https://github.com/tyleo/tyt"
description = "Commands for working with the Meshy API"
autobins = false

[[bin]]
name = "meshy"
path = "src/main.rs"
required-features = ["bin"]

[dependencies]
clap = { version = "4.5.58", features = ["derive"] }
clap_complete = { version = "4.5", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
ty-preferences = { version = "0.3.0", optional = true }
tyt-common = { version = "0.1.0" }
tyt-injection = { version = "0.1.0", optional = true }

[features]
default = ["impl"]
impl = ["dep:serde", "dep:ty-preferences", "dep:tyt-injection"]
bin = ["impl", "dep:clap_complete"]
