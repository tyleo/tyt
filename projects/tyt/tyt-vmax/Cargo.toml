[package]
name = "tyt-vmax"
version = "0.6.0"
edition = "2024"
license-file = "LICENSE"
repository = "https://github.com/tyleo/tyt"
description = "Commands for working with Voxel Max."
autobins = false

[package.metadata.workspaces]
independent = true

[[bin]]
name = "vmax"
path = "src/main.rs"
required-features = ["bin"]
doc = false

[dependencies]
branded-id = "0.2.0"
clap = { version = "4.5.58", features = ["derive"] }
treegrid = { version = "0.4.0", default-features = false, features = [
    "render_box_hierarchy",
] }
treeselect = "0.2.0"
ty-clap = { version = "0.1.0", optional = true }
ty-math = { version = "0.4.0", optional = true }
tyt-common = { version = "0.4.0" }
tyt-injection = { version = "0.5.0", optional = true }
vmax-codec = { version = "0.5.0", optional = true }
voxconv = { version = "0.4.0", default-features = false, features = [
    "ext",
    "impl",
    "vmax",
    "voxj",
], optional = true }

[features]
default = ["impl"]
impl = [
    "dep:ty-math",
    "dep:tyt-injection",
    "dep:vmax-codec",
    "dep:voxconv",
]
bin = ["impl", "dep:ty-clap"]
