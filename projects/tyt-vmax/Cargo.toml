[package]
name = "tyt-vmax"
version = "0.1.6"
edition = "2024"
license-file = "LICENSE"
repository = "https://github.com/tyleo/tyt"
description = "Commands for working with Voxel Max."
autobins = false

[[bin]]
name = "vmax"
path = "src/main.rs"
required-features = ["bin"]

[dependencies]
clap = { version = "4.5.58", features = ["derive"] }
clap_complete = { version = "4.5", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
tyt-common = { version = "0.1.0" }
tyt-injection = { version = "0.1.0", optional = true }
vmax = { version = "0.1.0", optional = true }
vmax-codec = { version = "0.1.0", optional = true }
voxj = { version = "0.1.0", optional = true }
voxj-codec = { version = "0.1.0", optional = true }

[features]
default = ["impl"]
impl = [
    "dep:serde",
    "dep:tyt-injection",
    "dep:vmax",
    "dep:vmax-codec",
    "dep:voxj",
    "dep:voxj-codec",
    "vmax/serde",
]
bin = ["impl", "dep:clap_complete"]
