[package]
name = "tyt-preferences"
version = "0.1.6"
edition = "2024"
license-file = "LICENSE"
repository = "https://github.com/tyleo/tyt"
description = "Preference loading from .tytconfig files for tyt sub-crates."

[dependencies]
serde = { version = "1", optional = true }
tyt-injection = { version = "0.1.0", optional = true }

[features]
default = ["impl"]
impl = ["dep:serde", "dep:tyt-injection"]
