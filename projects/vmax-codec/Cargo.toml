[package]
name = "vmax-codec"
version = "0.1.6"
edition = "2024"
license-file = "LICENSE"
repository = "https://github.com/tyleo/tyt"
description = "Reads and writes Voxel Max (.vmax) package files and their voxel/palette payloads."

[dependencies]
image = "0.25"
lzfse = "0.2"
plist = "1"
serde_json = { version = "1", features = ["preserve_order"] }
vmax = { version = "0.1.0", features = ["serde"] }
