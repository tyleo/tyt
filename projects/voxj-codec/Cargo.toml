[package]
name = "voxj-codec"
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"
repository = "https://github.com/tyleo/tyt"
description = "Encodes voxj types into .voxj / .voxjz documents."

[dependencies]
base64 = "0.22"
flate2 = "1"
serde_json = { version = "1", features = ["preserve_order"] }
voxj = { version = "0.1.0", features = ["serde"] }
