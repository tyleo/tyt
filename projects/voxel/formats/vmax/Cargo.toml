[package]
name = "vmax"
version = "0.4.0"
edition = "2024"
license-file = "LICENSE"
repository = "https://github.com/tyleo/tyt"
description = "Core data types for Voxel Max scenes and .vmaxb/.vmaxpsb payloads."
keywords = ["voxelmax", "vmax", "voxel", "3d", "model"]
categories = ["data-structures", "game-development", "graphics"]

[package.metadata.workspaces]
independent = true

[dependencies]
base64 = { version = "0.22", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_bytes = { version = "0.11", optional = true }

[features]
default = ["impl", "serde"]
impl = ["dep:base64"]
serde = ["dep:serde", "dep:serde_bytes"]
