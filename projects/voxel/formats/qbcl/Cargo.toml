[package]
name = "qbcl"
version = "0.2.0"
edition = "2024"
license-file = "LICENSE"
repository = "https://github.com/tyleo/tyt"
description = "Core data types for the Qubicle (.qb / .qbt / .qbcl) file formats."
keywords = ["qubicle", "qb", "qbt", "voxel", "3d"]
categories = ["data-structures", "game-development", "graphics"]

[package.metadata.workspaces]
independent = true

[package.metadata.docs.rs]
all-features = true

[features]
default = ["qb", "qbt", "qbcl"]
qb = []
qbt = []
qbcl = []

