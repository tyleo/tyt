[package]
name = "voxcore"
version = "0.2.2"
edition = "2024"
license-file = "LICENSE"
repository = "https://github.com/tyleo/tyt"
description = "Core types for working with voxels."

[package.metadata.workspaces]
independent = true

[dependencies]
branded-id = "0.1.9"
ty-math = { version = "0.2.0", default-features = false }

[features]
default = ["color"]
color = ["ty-math/color"]
