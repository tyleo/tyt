[package]
name = "voxcore"
version = "0.2.1"
edition = "2024"
license-file = "LICENSE"
repository = "https://github.com/tyleo/tyt"
description = "Core types for working with voxels."

[dependencies]
branded-id = "0.1.9"
serde = { version = "1", optional = true }
serde_json = { version = "1", optional = true }
ty-math = { version = "0.2.0", default-features = false }

[dev-dependencies]
# Derives the ext structs the keyed-transcode tests round-trip.
serde = { version = "1", features = ["derive"] }

[features]
default = ["json"]
color = ["ty-math/color"]
json = ["dep:serde", "dep:serde_json"]
