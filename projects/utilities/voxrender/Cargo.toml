[package]
name = "voxrender"
version = "0.5.0"
edition = "2024"
license-file = "LICENSE"
repository = "https://github.com/tyleo/tyt"
description = "The render contract for voxel scenes."

[package.metadata.workspaces]
independent = true

[package.metadata.docs.rs]
all-features = true

[dependencies]
branded-id = "0.2.0"
ty-math = { version = "0.4.0", default-features = false, features = ["color"] }
voxcore = { version = "0.4.0", default-features = false, features = ["color"] }

[features]
fixtures = []
