[package]
name = "voxrender-bench"
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"
repository = "https://github.com/tyleo/tyt"
description = "Benchmarks and prototypes for voxrender's GPU tiers."
publish = false

[dependencies]
branded-id = "0.2.0"
ty-math = { version = "0.4.0", default-features = false, features = ["color"] }
voxcore = { version = "0.4.0", default-features = false }
voxrender = { version = "0.5.0", features = ["fixtures"] }
voxrender-cpu = { version = "0.1.0", default-features = false }
voxrender-wgpu = "0.1.0"
wgpu = "30.0.1"
