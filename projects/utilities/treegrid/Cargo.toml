[package]
name = "treegrid"
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"
repository = "https://github.com/tyleo/tyt"
description = "Hierarchical-data rendering: populate a forest of labeled, data-bearing nodes, then render it under a chosen layout and label mode."

[dependencies]
branded-id = "0.1.7"
serde_json = { version = "1", features = ["preserve_order"], optional = true }
ty-math = { version = "0.2.0", optional = true }

[features]
default = ["render_columns", "render_hierarchy", "render_rows", "render_tables"]
json = ["dep:serde_json"]
render_columns = []
render_hierarchy = []
render_rows = []
render_tables = []
ty-math = ["dep:ty-math"]
