[package]
name = "treegrid"
version = "0.2.0"
edition = "2024"
license-file = "LICENSE"
repository = "https://github.com/tyleo/tyt"
description = "Hierarchical-data rendering: populate a forest of labeled, data-bearing nodes, then render it under a chosen layout and label mode."

[package.metadata.workspaces]
independent = true

[dependencies]
branded-id = "0.2.0"
serde_json = { version = "1", features = ["preserve_order"], optional = true }
ty-math = { version = "0.2.0", optional = true }

[features]
default = [
    "render_box_hierarchy",
    "render_box_tables",
    "render_md_lists",
    "render_md_tables",
    "render_text_columns",
    "render_text_rows",
]
json = ["dep:serde_json"]
render_box_hierarchy = []
render_box_tables = []
render_md_lists = []
render_md_tables = []
render_text_columns = []
render_text_rows = []
ty-math = ["dep:ty-math"]
