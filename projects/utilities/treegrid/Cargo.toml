[package]
name = "treegrid"
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"
repository = "https://github.com/tyleo/tyt"
description = "Hierarchical-data rendering: populate a forest of labeled, data-bearing nodes, then render it under a chosen layout and label mode."

[dependencies]
branded-id = "0.1.3"
serde_json = { version = "1", features = ["preserve_order"], optional = true }
ty-math = { version = "0.1.8", optional = true }

[features]
default = ["columns", "hierarchy", "rows", "tables"]
columns = []
hierarchy = []
json = ["dep:serde_json"]
rows = []
tables = []
ty-math = ["dep:ty-math"]
