[package]
name = "voxsmith"
version = "0.2.0"
edition = "2024"
license-file = "LICENSE"
repository = "https://github.com/tyleo/tyt"
description = "Utilities for working with voxels."

[dependencies]
base64 = { version = "0.22", optional = true }
branded-id = "0.1.7"
gltf = { version = "1.4.1", default-features = false, features = [
    "import",
    "names",
    "utils",
    "KHR_materials_emissive_strength",
    "KHR_materials_ior",
    "KHR_materials_transmission",
], optional = true }
goxl = { version = "0.1.0", optional = true }
goxl-codec = { version = "0.1.0", optional = true }
mvox = { version = "0.1.0", optional = true }
mvox-codec = { version = "0.1.0", optional = true }
pathspec = { version = "0.1.0", optional = true }
png = { version = "0.18.1", optional = true }
qbcl = { version = "0.1.0", optional = true }
qbcl-codec = { version = "0.1.0", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
treegrid = { version = "0.1.0", features = [
    "json",
    "ty-math",
], optional = true }
treeselect = { version = "0.1.0", optional = true }
ty-math = "0.2.0"
vmax = { version = "0.1.8", optional = true }
vmax-codec = { version = "0.2.0", optional = true }
vmax-voxcore = { version = "0.1.0", default-features = false, features = [
    "codec",
], optional = true }
voxcore = { version = "0.2.1", features = ["color"] }
voxj = { version = "0.1.3", optional = true }
voxj-codec = { version = "0.2.0", optional = true }
voxj-voxcore = { version = "0.2.0", features = ["codec"], optional = true }

[features]
default = ["ext", "goxl", "mvox", "qbcl", "vmax", "voxj"]

# Each codec feature gates its format crates and the voxsmith modules that
# convert that format. `qbcl` covers `.qb`, `.qbt`, and `.qbcl` because all
# three share the `qbcl` / `qbcl-codec` crates. `vmax` and `voxj` front their
# `-voxcore` bridge crates, which own the conversion. `ext` gates each
# format's `VoxExtCodec` impl, which keys its ext into a document `ext` block
# through voxcore's serde transcode.
ext = ["voxcore/json", "vmax-voxcore?/ext"]
goxl = ["dep:goxl", "dep:goxl-codec", "_codec", "_color"]
mvox = ["dep:mvox", "dep:mvox-codec", "_codec", "_color"]
qbcl = ["dep:qbcl", "dep:qbcl-codec", "_codec", "_color"]
vmax = ["dep:vmax", "dep:vmax-codec", "dep:vmax-voxcore", "_codec"]
voxj = ["dep:voxj", "dep:voxj-codec", "dep:voxj-voxcore", "_codec"]

# glTF meshing both ways. The reader loads a `Mesh` for the voxelizer. The
# `VoxObject`-to-glTF mesher and its `.gltf` / `.glb` writer add `serde_json`
# to build the document, `base64` to embed the buffer in text glTF, and `png`
# to encode the baked material atlas images. Because meshing is no voxel
# codec, it leaves `_codec` off.
gltf = ["dep:gltf", "dep:base64", "dep:png", "dep:serde_json", "_mesh"]

# The inspection reports over a loaded state, rendered to text, markdown, or
# JSON through treegrid. `serde_json` carries json-pool values into the
# palette report. `select` filters the hierarchy report by pattern, and
# treeselect propagates that filter over the scene tree. A report over a
# Voxel Json document's spec checks also needs `voxj`.
report = ["dep:treegrid", "dep:serde_json", "dep:treeselect", "select"]

# Selecting a state's nodes and objects by hierarchy path: gitignore-style
# globs through pathspec.
select = ["dep:pathspec"]


# Private markers the codec features enable. `_codec` marks that at least one
# codec is on, which voxsmith checks at compile time. `_color` gates the
# palette-color sampling helpers shared by Goxel, MagicaVoxel, and Qubicle,
# which re-sample colors per voxel.
_codec = []
_color = []

# Marks that a mesh front end such as `gltf` is on. It gates the generic
# `Mesh` type and the voxelizer.
_mesh = []

[dev-dependencies]
# Encodes the small base-color PNGs the per-texel voxelizer tests embed in a
# synthetic glTF. Already in the lock through the gltf `import` feature's image
# decoder, so it adds no new download.
png = "0.18"
# Parses the JSON layouts the report tests compare against each other.
serde_json = "1"
