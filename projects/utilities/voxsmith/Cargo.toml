[package]
name = "voxsmith"
version = "0.2.0"
edition = "2024"
license-file = "LICENSE"
repository = "https://github.com/tyleo/tyt"
description = "Utilities for working with voxels."

[dependencies]
base64 = { version = "0.22", optional = true }
branded-id = "0.1.7"
gltf = { version = "1.4.1", default-features = false, features = [
    "import",
    "names",
    "utils",
    "KHR_materials_emissive_strength",
    "KHR_materials_ior",
    "KHR_materials_transmission",
], optional = true }
pathspec = { version = "0.1.0", optional = true }
png = { version = "0.18.1", optional = true }
serde_json = { version = "1", optional = true }
treegrid = { version = "0.1.0", features = [
    "json",
    "ty-math",
], optional = true }
treeselect = { version = "0.1.0", optional = true }
ty-math = "0.2.0"
voxcore = { version = "0.2.1", default-features = false, features = ["color"] }

[features]
default = [
    "hierarchy_show",
    "info",
    "mesh",
    "palette_list",
    "palette_show",
    "validate",
    "voxelize",
]

# One feature per operation, named as vxl names the command.
hierarchy_show = ["_pathspec", "_treegrid", "dep:treeselect"]
info = ["_treegrid"]
# The glTF writer adds `serde_json` to build the document, `base64` to embed
# the buffer in text glTF, and `png` to encode the baked material atlas.
mesh = ["_gltf", "_pathspec", "dep:base64", "dep:png", "dep:serde_json"]
palette_list = ["_treegrid"]
# `serde_json` carries json-pool values into the palette report.
palette_show = ["_treegrid", "dep:serde_json"]
validate = ["_treegrid"]
voxelize = ["_gltf"]

_gltf = ["dep:gltf"]

# gitignore-style globs for hierarchy patterns and object selection.
_pathspec = ["dep:pathspec"]

_treegrid = ["dep:treegrid"]

[dev-dependencies]
# Encodes the small base-color PNGs the per-texel voxelizer tests embed in a
# synthetic glTF. Already in the lock through the gltf `import` feature's image
# decoder, so it adds no new download.
png = "0.18"
# Parses the JSON layouts the report tests compare against each other.
serde_json = "1"
