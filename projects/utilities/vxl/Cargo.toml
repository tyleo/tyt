[package]
name = "vxl"
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"
repository = "https://github.com/tyleo/tyt"
description = "A command-line tool for working with voxels."
autobins = false

[[bin]]
name = "vxl"
path = "src/main.rs"
required-features = ["bin"]

[dependencies]
clap = { version = "4.5.58", features = ["derive"] }
clap_complete = { version = "4.5", optional = true }
libc = { version = "0.2", optional = true }
ty-math = { version = "0.2.0", optional = true }
vmax = { version = "0.1.7", optional = true }
vmax-codec = { version = "0.1.0", optional = true }
voxcore = { version = "0.2.1", default-features = false }
voxsmith = { version = "0.2.0", features = ["report"] }

[dev-dependencies]
branded-id = "0.1.7"
ty-math = "0.2.0"

[features]
default = ["impl"]
impl = [
    "dep:libc",
    "dep:ty-math",
    "dep:vmax",
    "dep:vmax-codec",
    "voxsmith/gltf",
]
bin = ["impl", "dep:clap_complete"]
