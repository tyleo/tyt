[package]
name = "vxl"
version = "0.3.1"
edition = "2024"
license-file = "LICENSE"
repository = "https://github.com/tyleo/tyt"
description = "A command-line tool for working with voxels."
autobins = false

[package.metadata.workspaces]
independent = true

[[bin]]
name = "vxl"
path = "src/main.rs"
required-features = ["bin"]

[dependencies]
branded-id = "0.1.7"
clap = { version = "4.5.58", features = ["derive"] }
clap_complete = { version = "4.5", optional = true }
jsonc-parser = { version = "0.33.1", features = ["serde"] }
meshconv = "0.1.0"
meshdoc = "0.1.0"
serde = { version = "1", features = ["derive"] }
ty-preferences = "0.3.0"
vox-value-language = "0.1.0"
voxconv = "0.1.0"
voxcore = { version = "0.2.1", default-features = false }
voxsmith = { version = "0.3.0", default-features = false, features = [
    "hierarchy_show",
    "impl",
    "info",
    "mesh",
    "palette_list",
    "palette_show",
    "to",
    "validate",
    "voxelize",
] }

[dev-dependencies]
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
bin = ["dep:clap_complete"]
