[package]
name = "vxl"
version = "0.2.0"
edition = "2024"
license-file = "LICENSE"
repository = "https://github.com/tyleo/tyt"
description = "A command-line tool for working with voxels."
autobins = false

[[bin]]
name = "vxl"
path = "src/main.rs"
required-features = ["bin"]

[dependencies]
branded-id = "0.1.7"
clap = { version = "4.5.58", features = ["derive"] }
clap_complete = { version = "4.5", optional = true }
voxconv = "0.1.0"
voxcore = { version = "0.2.1", default-features = false }
voxsmith = { version = "0.2.0", default-features = false, features = [
    "hierarchy_show",
    "impl",
    "info",
    "mesh",
    "palette_list",
    "palette_show",
    "to",
    "validate",
    "voxelize",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
bin = ["dep:clap_complete"]
