[package]
name = "voxj"
version = "0.1.2"
edition = "2024"
license-file = "LICENSE"
repository = "https://github.com/tyleo/tyt"
description = "Core types for the Voxel Json (.voxj / .voxjz) format."
keywords = ["voxel", "voxj", "json", "3d", "model"]
categories = ["data-structures", "game-development", "graphics"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
serde_json = "1"

[features]
serde = ["dep:serde"]
